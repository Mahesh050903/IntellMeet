version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: intellmeet-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: intellmeet

  server:
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.server
    container_name: intellmeet-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/intellmeet
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=production_intellmeet_secure_jwt_secret_key_98765
      - JWT_REFRESH_SECRET=production_intellmeet_secure_refresh_secret_key_43210
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: ../docker/Dockerfile.client
    container_name: intellmeet-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
